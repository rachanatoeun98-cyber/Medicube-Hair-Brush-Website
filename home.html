                <img id="myImage" src="startpicture.jpg" alt="Image">
                <script>
                var images = ["https://i.pinimg.com/736x/25/db/b4/25dbb4ba15e4b07ae200bc360f3cd052.jpg", "https://i.pinimg.com/736x/91/81/0b/91810b41719775065be7d33e7fbe58bd.jpg", "https://i.pinimg.com/1200x/5a/d5/ae/5ad5ae8ecbf39fe8b40f5b31c9dfad1d.jpg"];
                var index = 0;
                function changeImage() {
                    index = (index + 1) % images.length;
                    document.getElementById("myImage").src = images[index];

                // Change image every 3 seconds
                setInterval(changeImage, 3000);
                </script>
